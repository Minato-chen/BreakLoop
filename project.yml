name: BreakLoop
options:
  bundleIdPrefix: com.breakloop
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "27.1"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  BreakLoop:
    type: application
    platform: macOS
    sources:
      - path: Sources/BreakLoop
    dependencies:
      - target: BreakLoopWidgetExtension
    info:
      path: BreakLoop-Info.plist
      properties:
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        LSUIElement: false
    settings:
      base:
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.breakloop.BreakLoop
        INFOPLIST_FILE: BreakLoop-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO

  BreakLoopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BreakLoopTests
    dependencies:
      - target: BreakLoop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breakloop.BreakLoopTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  BreakLoopWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: BreakLoopWidget
      - path: Sources/BreakLoop/Model/WidgetSharedData.swift
    info:
      path: BreakLoopWidget/Info.plist
      properties:
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.breakloop.BreakLoop.WidgetExtension
        INFOPLIST_FILE: BreakLoopWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
